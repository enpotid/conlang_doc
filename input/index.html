<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Input Tool</title>

    <style>
        @font-face {
          font-family: 'Conlang';
          src: url('../conlang.ttf') format('truetype');
        }
    
        .conlang {
          font-family: 'Conlang';
        }

        body {
            background-color: black;
            color: gray;
            display: flex;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <textarea style="width: 50vw; height: 100vh; font-size: 5vh; resize: none; background-color: gray;" id="conlang"></textarea>
    <h1 style="margin: 10px; font-size: 5vh; width: 50vw; word-break: break-word;" class="conlang" id="output"></h1>

    <script>
        const textarea = document.getElementById("conlang");
        const h1 = document.getElementById("output");

        textarea.addEventListener("input", () => {
            h1.innerText = "";
            let v = textarea.value.split(" ");
            v.forEach(element => {
                if (!isNaN(element)) {
                    h1.innerText += String.fromCharCode(57344 + Number(element));
                } else {
                    h1.innerText += element;
                }
            });
        });
    </script>
</body>
</html>

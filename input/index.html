<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Input Tool</title>

    <style>
        @font-face {
          font-family: 'Conlang';
          src: url('../conlang.ttf') format('truetype');
        }
    
        .conlang {
          font-family: 'Conlang';
        }

        body {
            background-color: black;
            color: gray;
            display: flex;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <textarea style="width: 50vw; height: 100vh; font-size: 5vh; resize: none; background-color: gray;" id="conlang"></textarea>
    <h1 style="margin: 10px; font-size: 5vh; width: 50vw; word-break: break-word;" class="conlang" id="output"></h1>

    <script>
        const textarea = document.getElementById("conlang");
        const h1 = document.getElementById("output");

        textarea.addEventListener("input", () => {
            h1.innerText = "";
            let v = textarea.value;
            if (v.length % 4 == 0) {
                for (let i = 0; i < v.length / 4; i++) {
                    h1.innerText += String.fromCharCode(57344 + to_bit(v[i * 4]) * (1 << 9) + to_bit(v[i * 4 + 1]) * (1 << 6) + to_bit(v[i * 4 + 2]) * (1 << 3) + to_bit(v[i * 4 + 3]));
                }
            }
        });

        function to_bit(a) {
            switch (a) {
                case "q": return 0;
                case "w": return 1;
                case "e": return 2;
                case "a": return 3;
                case "d": return 4;
                case "z": return 5;
                case "x": return 6;
                case "c": return 7;
            }
        }
    </script>
</body>
</html>

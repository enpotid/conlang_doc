<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang</title>

    <style>
        @font-face {
          font-family: 'Conlang';
          src: url('conlang.ttf') format('truetype');
        }
    
        .conlang {
          font-family: 'Conlang';
        }

        body {
            background-color: black;
            color: gray;
        }

        span:hover {
            color: green;
        }
    </style>
</head>
<body>
    <a href="input/index.html" style="font-size: 50px;">Conlang Input Tool</a>
    <div class="conlang" style="font-size: 100px; word-break: break-word;">
        <script>
            for (let i = 0xE000; i <= 0xE000 + 4095; i++) {
                document.write(`<span onclick="redirectWord(${i - 0xE000})">&#x${i.toString(16)};</span>`);
            }

            function redirectWord(id) {
                window.location.href = 'word/index.html?id=' + id;
            }
        </script>
    </div>
</body>
</html>

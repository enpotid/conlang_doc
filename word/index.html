<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word</title>

    <style>
        @font-face {
          font-family: 'Conlang';
          src: url('../conlang.ttf') format('truetype');
        }
    
        .conlang {
          font-family: 'Conlang';
        }

        body {
            background-color: black;
            color: gray;
            margin: 0;
            display: flex;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            const h1 = document.createElement("h1");
            h1.className = "conlang";
            h1.style.fontSize = "1000px"
            h1.style.margin = "0px"
            h1.innerHTML = `&#x${(parseInt(id) + 0xE000).toString(16)};`;

            const div = document.createElement("div");
            div.style.margin = "100px"

            const h2 = document.createElement("h2");
            h2.style.fontSize = "100px"
            h2.innerHTML = id;

            const h3 = document.createElement("h3");
            h3.style.fontSize = "100px"
            h3.style.wordBreak = "break-word";
            h3.className = "conlang";
            for (let i = 0; i < 100; i++) {
                h3.innerHTML += `&#x${(Math.floor(Math.random() * (1 << 12)) + 0xE000).toString(16)};`;
            }

            div.appendChild(h2);
            div.appendChild(h3);

            document.body.appendChild(h1);
            document.body.appendChild(div);
        };
    </script>
</body>
</html>
